name: aish_warehouse
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3

  # --- Reporting & Export (Milestone 10) ------------------------------------
  #
  # Three capabilities the reporting module cannot fake, and one package each:
  #
  # * `excel` writes a real `.xlsx` (a ZIP of OOXML parts) in pure Dart, so the
  #   exporter tests can read the workbook back and assert on its cells rather
  #   than on a byte blob. There is deliberately no second spreadsheet package.
  # * `pdf` renders a real PDF in pure Dart with built-in Helvetica metrics, so
  #   nothing has to be fetched at runtime — G-L3 is offline-first. `printing`
  #   is deliberately **not** added: it only adds a platform print/preview
  #   dialog, and this module shares files through the share sheet instead.
  #   Pinned to `^3.12.0` rather than `^3.13.0`: 3.13 moved to `xml ^7`, which
  #   `excel` cannot take yet, and the two must share one `xml`. This is a
  #   version constraint, not an override — there is no `dependency_overrides`
  #   block anywhere in this file.
  # * `share_plus` opens the platform share sheet §4.3 asks for. It is the only
  #   platform channel this module touches, and it is reached exclusively
  #   through `ReportShareGateway` so tests never invoke it for real.
  #
  #   Unchanged in Milestone 11, and that took deciding — see the note on
  #   `file_selector` below.
  #
  # `path_provider` was already a dependency; the reporting file store reuses it
  # for the app-private directory files are written to, which is why no storage
  # permission is requested anywhere.
  excel: ^4.0.6
  pdf: ^3.12.0
  share_plus: ^13.3.0

  # --- Master Data & Template Import (Milestone 11) --------------------------
  #
  # Two capabilities the import module cannot fake, and one package each. There
  # is deliberately **no** second spreadsheet package: the template generator and
  # the workbook parser both use the `excel` above, so the file this application
  # writes and the file it reads back are the same format understood by the same
  # code (G-M2).
  #
  # * `file_selector` lets a Super Admin choose an `.xlsx` from their device. It
  #   is reached exclusively through `MasterImportFilePicker`, so no test ever
  #   invokes the platform channel, and it is configured for a single extension
  #   and MIME type — no gallery access, no media permission, and no
  #   `READ_EXTERNAL_STORAGE`: the platform hands back a file the user picked,
  #   which is the whole point of a document picker.
  #
  #   `file_picker` was the obvious choice and does not work here. Every
  #   **stable** `file_picker` requires `win32 ^5.9.0`; `share_plus` 13 — shipped
  #   since Milestone 10 — requires `win32 ^6.0.1`, and pub cannot satisfy both.
  #   Four ways out were considered: (a) a `dependency_override`, which this file
  #   has never had and which would only hide the conflict from the solver;
  #   (b) `file_picker 12.0.0-beta`, i.e. a pre-release on the one path that reads
  #   a user's file; (c) downgrading `share_plus` to the 12.x line, which does
  #   resolve — and then **fails to compile**, because `share_plus 12.0.2`'s
  #   Android Kotlin source does not build against this project's toolchain; or
  #   (d) a different picker. (d) is chosen. `file_selector` is the Flutter team's
  #   own package from `flutter/packages` and depends on no `win32` at all, so
  #   both packages stay at their current versions, nothing is overridden, and the
  #   Milestone 10 reporting stack is untouched.
  # * `crypto` computes the SHA-256 that `import_logs.file_sha256` stores and
  #   that the commit re-verifies before it re-parses a single row (§28). It was
  #   already in `pubspec.lock` transitively, and a package this module `import`s
  #   directly belongs in this list rather than being relied on through somebody
  #   else's dependency graph.
  #
  # `path_provider` was already a dependency; the audit source-file store reuses
  # it for the app documents directory, which is why retaining a source file
  # still requests no storage permission anywhere.
  file_selector: ^1.1.0
  crypto: ^3.0.6
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

